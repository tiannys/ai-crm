version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ai-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_secret_2026
      POSTGRES_DB: ai_crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_user -d ai_crm']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
